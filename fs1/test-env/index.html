<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Knob Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #16213e;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #0f3460;
        }
        .header h1 { font-size: 18px; color: #e94560; }
        .status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .status-dot.connected { background: #4caf50; }
        .main { flex: 1; display: flex; overflow: hidden; }
        .sim-panel {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-y: auto;
        }
        .sim-frame {
            width: 360px; height: 360px; border-radius: 50%;
            overflow: hidden; border: 3px solid #e94560;
            background: #000; position: relative;
        }
        #mp-frame { width: 100%; height: 100%; border: none; }
        .side-panel {
            flex: 0 0 auto;
            width: 520px; background: #16213e;
            border-left: 1px solid #0f3460;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .resize-handle {
            width: 5px; cursor: col-resize; flex-shrink: 0;
            background: #0f3460; transition: background 0.15s;
        }
        .resize-handle:hover, .resize-handle.active { background: #e94560; }
        .panel-section { padding: 15px; border-bottom: 1px solid #0f3460; }
        .panel-section h3 { font-size: 12px; color: #e94560; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .guid-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
        .guid-row label { font-size: 11px; color: #888; }
        .guid-row input, .guid-row select {
            padding: 6px 8px; border: 1px solid #0f3460; background: #0d1117;
            color: #c9d1d9; border-radius: 4px; font-family: monospace; font-size: 13px;
        }
        .guid-row select { cursor: pointer; }
        .guid-row select option { background: #0d1117; color: #c9d1d9; }
        .ws-status-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .ws-status-row .status-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #555;
            transition: background 0.3s;
        }
        .ws-status-row .status-dot.connected { background: #3fb950; }
        .encoder-controls { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .knob-visual {
            width: 120px; height: 120px; border-radius: 50%;
            background: linear-gradient(145deg, #2a2a4a, #1a1a2e);
            border: 3px solid #e94560; position: relative; cursor: grab;
            user-select: none; transition: border-color 0.15s;
        }
        .knob-visual::after {
            content: ''; position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%); width: 4px; height: 20px;
            background: #e94560; border-radius: 2px;
        }
        .knob-visual:active { cursor: grabbing; border-color: #ff6b81; }
        .encoder-btns { display: flex; gap: 10px; }
        .enc-btn {
            padding: 8px 16px; border: 1px solid #0f3460; background: #1a1a2e;
            color: #e0e0e0; border-radius: 6px; cursor: pointer; font-size: 14px;
            user-select: none; transition: background 0.15s;
        }
        .enc-btn:hover { background: #0f3460; }
        .enc-btn:active { background: #e94560; }
        .btn-press {
            width: 100%; padding: 10px; border: 2px solid #e94560;
            background: #1a1a2e; color: #e94560; border-radius: 6px;
            cursor: pointer; font-size: 14px; font-weight: bold;
            transition: background 0.15s;
        }
        .btn-press:active { background: #e94560; color: white; }
        .btn-start {
            width: 100%; padding: 10px; margin-top: 10px; border: 2px solid #3fb950;
            background: #1a1a2e; color: #3fb950; border-radius: 6px;
            cursor: pointer; font-size: 14px; font-weight: bold;
            transition: background 0.15s;
        }
        .btn-start:hover:not(:disabled) { background: #3fb950; color: white; }
        .btn-start:disabled { opacity: 0.4; cursor: default; }
        .code-editor { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .code-editor textarea {
            flex: 1; background: #0d1117; color: #c9d1d9; border: none;
            padding: 10px; font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px; resize: none; outline: none; tab-size: 4;
        }
        .code-toolbar {
            display: flex; gap: 5px; padding: 8px 15px;
            background: #0d1117; border-top: 1px solid #30363d;
        }
        .code-toolbar button {
            padding: 6px 12px; border: 1px solid #30363d; background: #21262d;
            color: #c9d1d9; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .code-toolbar button:hover { background: #30363d; }
        .code-toolbar button.primary { background: #e94560; border-color: #e94560; color: white; }
        .console {
            height: 160px; background: #0d1117; border-top: 1px solid #30363d;
            overflow-y: auto; padding: 8px 15px;
            font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; color: #8b949e;
        }
        .console .log { color: #8b949e; }
        .console .error { color: #f85149; }
        .console .info { color: #58a6ff; }
        .console .ok { color: #3fb950; }
        .ws-log {
            max-height: 100px; overflow-y: auto; font-family: monospace;
            font-size: 11px; background: #0d1117; padding: 8px; border-radius: 4px;
        }
        .ws-log .sent { color: #3fb950; }
        .ws-log .recv { color: #58a6ff; }
        .help-text { font-size: 11px; color: #666; margin-top: 8px; text-align: center; }
        .file-bar {
            display: flex; align-items: center; gap: 10px;
            background: #0d1117; border-top: 1px solid #30363d;
            padding: 7px 15px; font-size: 12px; color: #8b949e;
        }
        .file-bar input {
            flex: 1; background: #161b22; border: 1px solid #30363d;
            color: #58a6ff; font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px; padding: 4px 8px; border-radius: 4px;
            outline: none; cursor: default;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Smart Knob Simulator</h1>
        <div class="status">
            <span id="mp-status" style="color:#666">MicroPython: Not loaded</span>
        </div>
    </div>

    <div class="main">
        <div class="sim-panel">
            <div class="sim-frame" id="sim-frame">
                <iframe id="mp-frame" src="static/lvgl.html?v=7"></iframe>
            </div>
            <p class="help-text">Click display to touch · Arrow keys to rotate encoder · Ctrl+Enter to run code</p>
        </div>

        <div class="resize-handle" id="resize-handle"></div>

        <div class="side-panel" id="side-panel">
            <div class="panel-section">
                <h3>Knob Identity</h3>
                <div class="guid-row">
                    <label for="guid-input">Machine:</label>
                    <select id="guid-input">
                        <option value="">— waiting for bootstrap —</option>
                    </select>
                </div>
                <div class="ws-status-row">
                    <span id="ws-status-text">Disconnected</span>
                    <span id="ws-status" class="status-dot"></span>
                </div>
                <button class="btn-start" id="btn-start" disabled>Start Bootstrap</button>
            </div>

            <div class="panel-section">
                <h3>Encoder</h3>
                <div class="encoder-controls">
                    <div class="knob-visual" id="knob-visual"></div>
                    <div class="encoder-btns">
                        <button class="enc-btn" id="btn-ccw">◀ CCW</button>
                        <button class="enc-btn" id="btn-cw">CW ▶</button>
                    </div>
                    <button class="btn-press" id="btn-press">BUTTON</button>
                </div>
            </div>

            <div class="panel-section">
                <h3>WebSocket Log</h3>
                <div class="ws-log" id="ws-log"></div>
            </div>

            <div class="code-editor">
                <div class="code-toolbar">
                    <button class="primary" id="btn-run">▶ Run</button>
                    <button id="btn-stop">⏹ Stop</button>
                    <button id="btn-clear-log">Clear Log</button>
                    <button id="btn-load-fs">Load from fs1/</button>
                </div>
                <textarea id="code-editor" spellcheck="false" placeholder="# Write MicroPython + LVGL code here..."></textarea>
            </div>

            <div class="console" id="console"></div>
        </div>
    </div>

    <div class="file-bar">
        <span>Running:</span>
        <input type="text" id="current-file" readonly value="—" placeholder="—">
    </div>

<script>
// =============================================
// Smart Knob Simulator
// =============================================

const WS_URL = `ws://${location.hostname || 'localhost'}:8766`;
let ws = null;
let wsConnected = false;
let mpReady = false;
let encoderRot = 0;

const $ = id => document.getElementById(id);
const consoleEl = $('console');
const wsLog = $('ws-log');
const codeEditor = $('code-editor');
const knobVisual = $('knob-visual');
// touch overlay removed

// =============================================
// Logging
// =============================================

function log(msg, cls = 'log') {
    const t = new Date().toLocaleTimeString();
    const d = document.createElement('div');
    d.className = cls;
    d.textContent = `[${t}] ${msg}`;
    consoleEl.appendChild(d);
    consoleEl.scrollTop = consoleEl.scrollHeight;
}

function logWs(dir, data) {
    const t = new Date().toLocaleTimeString();
    const d = document.createElement('div');
    d.className = dir;
    const s = JSON.stringify(data);
    d.textContent = `[${t}] ${dir === 'sent' ? '>>>' : '<<<'} ${s.length > 80 ? s.slice(0, 80) + '...' : s}`;
    wsLog.appendChild(d);
    wsLog.scrollTop = wsLog.scrollHeight;
}

// =============================================
// WebSocket Bridge Connection
// =============================================

function connectWs() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
        wsConnected = true;
        document.getElementById('ws-status').classList.add('connected');
        document.getElementById('ws-status-text').textContent = 'Connected to bridge';
        log('WebSocket connected to bridge', 'ok');
        ws.send(JSON.stringify({ sender: 'browser', type: 'ready' }));
    };

    ws.onmessage = (ev) => {
        try {
            const msg = JSON.parse(ev.data);
            logWs('recv', msg);
            handleWsMsg(msg);
        } catch (e) {
            log(`WS parse error: ${e}`, 'error');
        }
    };

    ws.onclose = (e) => {
        wsConnected = false;
        document.getElementById('ws-status').classList.remove('connected');
        document.getElementById('ws-status-text').textContent = 'Disconnected';
        log(`WebSocket closed (code=${e.code} reason='${e.reason}') — retrying in 3s...`, 'error');
        setTimeout(connectWs, 3000);
    };

    window.addEventListener('beforeunload', () => {
        console.log('[sim] PAGE unloading');
    });
    document.addEventListener('visibilitychange', () => {
        console.log('[sim] visibility:', document.visibilityState);
    });

    ws.onerror = () => log('WebSocket error', 'error');
}

function wsSend(data) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
        logWs('sent', data);
    }
}

function populateMachineDropdown(machines) {
    const sel = document.getElementById('guid-input');
    sel.innerHTML = '';
    if (!machines || machines.length === 0) {
        sel.innerHTML = '<option value="">— no machines configured —</option>';
        return;
    }
    let firstVal = '';
    machines.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.guid;
        opt.textContent = `${m.name} (${m.location})`;
        sel.appendChild(opt);
        if (!firstVal) firstVal = opt.value;
    });
    if (sel.value === '' || sel.value === '— waiting for bootstrap —') {
        sel.value = firstVal;
    }
    log(`Loaded ${machines.length} machine configs`, 'ok');
}

function handleWsMsg(msg) {
    if (msg.machines) {
        populateMachineDropdown(msg.machines);
    }
    if (msg.type === 'execute') {
        window._bootstrapped = true;
        $('current-file').value = msg.file || 'unknown';
        if (window._bootstrapTimer) {
            clearTimeout(window._bootstrapTimer);
            window._bootstrapTimer = undefined;
        }
        let code = msg.code;
        if (msg.file === 'bootstrap.py') {
            // Gate bootstrap on user choice of machine/location.
            // Keep the raw code; the _MACHINE_GUID override is applied on Start
            // so the dropdown can still be changed before bootstrapping.
            window._pendingBootstrap = code;
            const btn = $('btn-start');
            btn.disabled = false;
            btn.textContent = 'Start Bootstrap';
            log('Bootstrap ready — pick a machine above, then press Start Bootstrap', 'info');
            return;
        }
        const guidOverride = document.getElementById('guid-input').value.trim();
        if (guidOverride) {
            code = `_MACHINE_GUID = "${guidOverride}"\n` + code;
        }
        log(`Executing code from server (${code.length} chars)`, 'info');
        codeEditor.value = code;
        runInSimulator(code);
        if (!mpFrameReady) {
            window._lastServerCode = code;
        }
    } else if (msg.type === 'config') {
        const config = msg.config;
        $('current-file').value = `config — ${config.name || config.machine_guid || ''}`;
        log(`Config received: ${JSON.stringify(config).slice(0, 80)}...`, 'info');
        runInSimulator(`
import json
_MACHINE_CONFIG = ${JSON.stringify(config).replace(/:true/g,':True').replace(/:false/g,':False').replace(/:null/g,':None')}
print(json.dumps({"type": "config_ack", "status": "ok"}))
`);
    } else if (msg.type === 'data_update') {
        log(`Data update: ${msg.app} = ${JSON.stringify(msg.data)}`, 'info');
        runInSimulator(`
import json
try:
    on_data_update(json.loads('${JSON.stringify(msg.data)}'))
except NameError:
    pass
except Exception as e:
    print(f"on_data_update error: {e}")
`);
    }
}

// =============================================
// MicroPython WASM Integration
// =============================================

const mpFrame = $('mp-frame');
let mpFrameLoads = 0;
let mpFrameReady = false;
mpFrame.addEventListener('load', () => {
    mpFrameLoads++;
    log(`Simulator iframe loaded (${mpFrameLoads} load event(s))`, 'info');
});

function runInSimulator(code) {
    if (mpFrame && mpFrame.contentWindow) {
        mpFrame.contentWindow.postMessage({ execute: code }, '*');
        log('Code sent to simulator', 'info');
    } else {
        log('Simulator iframe not ready', 'error');
    }
}

// Listen for messages from the MicroPython iframe
window.addEventListener('message', (ev) => {
    if (ev.data && ev.data.type === 'iframe_loaded') {
        mpFrameReady = true;
        log(`Iframe loaded (ts=${ev.data.ts})`, 'info');
    }
    if (ev.data && ev.data.type === 'code_received') {
        window._lastServerCode = null;
    }
    if (ev.data && ev.data.type === 'iframe_unload') {
        log(`Iframe UNLOADING (ts=${ev.data.ts}) — parent still alive`, 'error');
    }
    if (ev.data && ev.data.type === 'mp_ready') {
        mpReady = true;
        $('mp-status').textContent = 'MicroPython: Ready';
        $('mp-status').style.color = '#4caf50';
        log('MicroPython WASM loaded', 'ok');
        if (window._lastServerCode) {
            log('Re-sending server code (was dropped pre-iframe-load)', 'info');
            runInSimulator(window._lastServerCode);
            window._lastServerCode = null;
        }
        // Fallback: if no bootstrap from server within 2s, load default code
        if (window._bootstrapTimer === undefined) {
            window._bootstrapTimer = setTimeout(() => {
                if (!window._bootstrapped) {
                    log('No bootstrap received — loading default code', 'info');
                    loadDefaultCode();
                }
            }, 2000);
        }
    }
    if (ev.data && ev.data.stdout) {
        const text = ev.data.stdout.trim();
        log(`MP: ${text}`, 'info');
        // Forward JSON messages from MicroPython back to the bridge
        if (text.startsWith('{') && text.endsWith('}')) {
            try {
                const mpMsg = JSON.parse(text);
                if (mpMsg.type === 'app_loaded') {
                    $('current-file').value = (mpMsg.app || 'app') + '.py — running';
                    log(`App loaded: ${mpMsg.name || mpMsg.app}`, 'ok');
                } else if (mpMsg.type === 'app_closed') {
                    $('current-file').value = 'launcher.py';
                    log(`App closed: ${mpMsg.app || ''}`, 'info');
                }
                if (mpMsg.type && mpMsg.type !== 'app_loaded' && mpMsg.type !== 'app_closed') {
                    wsSend(mpMsg);
                }
            } catch (e) {
                // Not JSON — just a print
            }
        }
    }
    if (ev.data && ev.data.stderr) {
        log(`MP ERR: ${ev.data.stderr}`, 'error');
    }

});

function loadDefaultCode() {
    codeEditor.value = `s = lv.screen_active()
s.set_style_bg_color(lv.color_hex(0x000000), 0)

title = lv.label(s)
title.set_text("Smart Knob")
title.set_style_text_color(lv.color_hex(0xffffff), 0)
title.set_style_text_font(lv.font_montserrat_16, 0)
title.align(lv.ALIGN.TOP_MID, 0, 30)

arc = lv.arc(s)
arc.set_size(200, 200)
arc.align(lv.ALIGN.CENTER, 0, 0)
arc.set_range(0, 100)
arc.set_value(50)
arc.set_start_angle(135)
arc.set_end_angle(405)
arc.set_style_arc_color(lv.color_hex(0x007AFF), lv.PART.INDICATOR)
arc.set_style_arc_width(10, lv.PART.INDICATOR)
arc.set_style_arc_color(lv.color_hex(0x333333), lv.PART.MAIN)
arc.set_style_arc_width(10, lv.PART.MAIN)

val = lv.label(arc)
val.set_text("50%")
val.set_style_text_color(lv.color_hex(0xffffff), 0)
val.set_style_text_font(lv.font_montserrat_14, 0)
val.align(lv.ALIGN.CENTER, 0, 0)

status = lv.label(s)
status.set_text("Rotate knob to adjust")
status.set_style_text_color(lv.color_hex(0x666666), 0)
status.set_style_text_font(lv.font_montserrat_14, 0)
status.align(lv.ALIGN.BOTTOM_MID, 0, -30)

def on_encoder(delta):
    v = arc.get_value() + delta
    v = max(0, min(100, v))
    arc.set_value(v)
    val.set_text(str(v) + "%")

def on_button():
    pass

def on_data_update(data):
    pass

_touch_val = None
_touch_bg_start = None
_touch_bg_end = None
def on_touch(x, y, pressed):
    global _touch_val, _touch_bg_start, _touch_bg_end
    if not pressed:
        _touch_val = None
        return
    import math
    if _touch_bg_start is None:
        _touch_bg_start = arc.get_bg_angle_start()
        _touch_bg_end = arc.get_bg_angle_end()
        print("arc bg_angles:", _touch_bg_start, _touch_bg_end)
    cx, cy = 180, 180
    dx = x - cx
    dy = y - cy
    angle = math.atan2(dy, dx) * 180 / math.pi
    angle = (angle + 360) % 360
    a_start = _touch_bg_start
    a_end = _touch_bg_end
    if a_start < a_end:
        if angle < a_start or angle > a_end:
            v = 0 if angle <= (a_start + a_end) // 2 else 100
        else:
            v = round((angle - a_start) / (a_end - a_start) * 100)
    else:
        # wrap around (e.g., 270 to 90)
        if angle < a_start and angle > a_end:
            v = 0 if angle <= (a_start + 360 + a_end) // 2 % 360 else 100
        else:
            if angle >= a_start:
                v = round((angle - a_start) / (360 + a_end - a_start) * 100)
            else:
                v = round((angle + 360 - a_start) / (360 + a_end - a_start) * 100)
    if v != _touch_val:
        _touch_val = v
        arc.set_value(v)
        val.set_text(str(v) + "%")

print("Ready")
`;
}

// =============================================
// Encoder Events
// =============================================

function sendEncoder(direction, delta = 1) {
    log(`Encoder: ${direction}`, 'info');
    wsSend({ sender: 'browser', type: 'encoder', direction, delta });

    const sign = direction === 'cw' ? delta : -delta;
    runInSimulator(`
try:
    on_encoder(${sign})
except NameError:
    pass
except Exception as e:
    print(f"on_encoder error: {e}")
`);
}

function sendButton() {
    log('Button: pressed', 'info');
    wsSend({ sender: 'browser', type: 'button' });
    runInSimulator(`
try:
    on_button()
except NameError:
    pass
except Exception as e:
    print(f"on_button error: {e}")
`);
}

// Knob rotation via drag
let dragging = false, lastAngle = 0;

knobVisual.addEventListener('mousedown', (e) => {
    dragging = true;
    const r = knobVisual.getBoundingClientRect();
    lastAngle = Math.atan2(e.clientY - r.top - 60, e.clientX - r.left - 60);
    e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const r = knobVisual.getBoundingClientRect();
    const angle = Math.atan2(e.clientY - r.top - 60, e.clientX - r.left - 60);
    let delta = angle - lastAngle;
    if (delta > Math.PI) delta -= 2 * Math.PI;
    if (delta < -Math.PI) delta += 2 * Math.PI;

    if (Math.abs(delta) > 0.15) {
        const steps = Math.round(delta / 0.15);
        encoderRot += steps;
        knobVisual.style.transform = `rotate(${encoderRot * 15}deg)`;
        sendEncoder(steps > 0 ? 'cw' : 'ccw', Math.abs(steps));
        lastAngle = angle;
    }
});

document.addEventListener('mouseup', () => { dragging = false; });

// Button controls
$('btn-cw').addEventListener('click', () => {
    encoderRot++;
    knobVisual.style.transform = `rotate(${encoderRot * 15}deg)`;
    sendEncoder('cw');
});

$('btn-ccw').addEventListener('click', () => {
    encoderRot--;
    knobVisual.style.transform = `rotate(${encoderRot * 15}deg)`;
    sendEncoder('ccw');
});

$('btn-press').addEventListener('click', sendButton);

$('btn-start').addEventListener('click', () => {
    const raw = window._pendingBootstrap;
    if (!raw) return;
    window._pendingBootstrap = null;
    $('btn-start').disabled = true;
    const guidOverride = document.getElementById('guid-input').value.trim();
    const code = guidOverride
        ? `_MACHINE_GUID = "${guidOverride}"\n` + raw
        : raw;
    $('current-file').value = 'bootstrap.py';
    log(`Starting bootstrap (${guidOverride || 'default simulator'})...`, 'info');
    codeEditor.value = code;
    runInSimulator(code);
    if (!mpFrameReady) {
        window._lastServerCode = code;
    }
});

// Resizable right panel (not persisted)
const resizeHandle = $('resize-handle');
const sidePanel = $('side-panel');
let resizing = false;
const MIN_PANEL = 340;
const MAX_PANEL_FRAC = 0.85;

resizeHandle.addEventListener('mousedown', (e) => {
    resizing = true;
    resizeHandle.classList.add('active');
    document.body.style.userSelect = 'none';
    e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
    if (!resizing) return;
    const max = window.innerWidth * MAX_PANEL_FRAC;
    const width = Math.max(MIN_PANEL, Math.min(max, window.innerWidth - e.clientX));
    sidePanel.style.width = width + 'px';
});

document.addEventListener('mouseup', () => {
    if (resizing) {
        resizing = false;
        resizeHandle.classList.remove('active');
        document.body.style.userSelect = '';
    }
});



// Keyboard
document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'TEXTAREA') return;

    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
        e.preventDefault();
        encoderRot++;
        knobVisual.style.transform = `rotate(${encoderRot * 15}deg)`;
        sendEncoder('cw');
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
        e.preventDefault();
        encoderRot--;
        knobVisual.style.transform = `rotate(${encoderRot * 15}deg)`;
        sendEncoder('ccw');
    } else if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault();
        $('btn-run').click();
    }
});

// Code editor controls
$('btn-run').addEventListener('click', () => {
    const code = codeEditor.value;
    if (code.trim()) {
        $('current-file').value = 'editor — custom code';
        log('Running code...', 'info');
        runInSimulator(code);
    }
});

$('btn-stop').addEventListener('click', () => {
    log('Stopping...', 'info');
    runInSimulator('import sys; sys.exit()');
});

$('btn-clear-log').addEventListener('click', () => {
    consoleEl.innerHTML = '';
    wsLog.innerHTML = '';
});

$('btn-load-fs').addEventListener('click', () => {
    log('Load from fs1/ — use the code editor to paste plugin code', 'info');
});

// =============================================
// Init
// =============================================

connectWs();
log('Smart Knob Simulator initialized', 'ok');
log('Arrow keys or drag knob = rotate encoder', 'log');
log('Ctrl+Enter = run code', 'log');
</script>
</body>
</html>
